# GitHub Pages über Actions statt über den Legacy-Builder.
#
# Warum: Der klassische Jekyll-Builder hat dieses Repo dreimal mit
# „Page build failed." (0 ms) abgewiesen, dann 8 Minuten gebraucht und die
# Seite anschließend dauerhaft mit 503 ausgeliefert — ohne verwertbare
# Fehlermeldung. Der Actions-Weg ist der von GitHub empfohlene und zeigt im
# Fehlerfall ein echtes Protokoll.
#
# Deployt wird der Repo-Inhalt unverändert. _projekt/, material/ und beweise/
# sind per .gitignore ohnehin nicht im Repo.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
